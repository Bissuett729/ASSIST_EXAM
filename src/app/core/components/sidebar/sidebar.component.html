<aside 
class="absolute w-64 h-full px-2 bg-layout-light border-r dark:border-r-[#181a26] dark:bg-layout-dark transition-[left] duration-300 flex flex-col justify-between"
[ngClass]="_signals.openSidebarLeft$() ? 'left-0' : '-left-64'">

<section class="flex flex-col">
  <div class="h-16 w-full flex items-center justify-center border-b dark:border-b-[#181a26]">
    <span class="text-textPrimaryLight dark:text-textPrimaryDark tracking-widest font-medium text-2xl select-none">ASSIST EXAM</span>
  </div>

  <div class="flex w-full items-center justify-center border-b py-2 dark:border-b-[#181a26]">
    <img class="w-1/3" src="avatars/Erick.png" alt="profile">

    <div class="flex flex-col items-center">
      <span class="font-medium text-lg text-textPrimaryLight dark:text-textPrimaryDark select-none">Miguel Bissuett</span>
      <div class="flex items-center gap-1">
        <span class="text-sm text-textPrimaryLight dark:text-textPrimaryDark select-none">Administrador</span>
        <span class="h-2 w-2 rounded-full bg-green-500"></span>
      </div>
    </div>
  </div>

  <div class="flex flex-col gap-2 py-2 px-2 border-b dark:border-b-[#181a26]">
    <button class="flex items-center p-2 select-none rounded-lg first-letter:hover:bg-[#EAEDFB] dark:hover:bg-[#303343] text-black/70 dark:text-[#BEC0C9] gap-2" routerLink="profile" routerLinkActive="!bg-primary !text-white">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-user-circle"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M12 12m-9 0a9 9 0 1 0 18 0a9 9 0 1 0 -18 0" /><path d="M12 10m-3 0a3 3 0 1 0 6 0a3 3 0 1 0 -6 0" /><path d="M6.168 18.849a4 4 0 0 1 3.832 -2.849h4a4 4 0 0 1 3.834 2.855" /></svg>
      <span>Perfil</span>
    </button>

    <button class="flex items-center p-2 select-none hover:bg-[#EAEDFB] dark:hover:bg-[#303343] rounded-lg text-black/70 dark:text-[#BEC0C9] gap-2" routerLink="users" routerLinkActive="!bg-primary !text-white">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-users-group"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M10 13a2 2 0 1 0 4 0a2 2 0 0 0 -4 0" /><path d="M8 21v-1a2 2 0 0 1 2 -2h4a2 2 0 0 1 2 2v1" /><path d="M15 5a2 2 0 1 0 4 0a2 2 0 0 0 -4 0" /><path d="M17 10h2a2 2 0 0 1 2 2v1" /><path d="M5 5a2 2 0 1 0 4 0a2 2 0 0 0 -4 0" /><path d="M3 13v-1a2 2 0 0 1 2 -2h2" /></svg>
      <span>Usuarios</span>
    </button>

    <button class="flex items-center p-2 select-none hover:bg-[#EAEDFB] dark:hover:bg-[#303343] rounded-lg text-black/70 dark:text-[#BEC0C9] gap-2" routerLink="generate-exam" routerLinkActive="!bg-primary !text-white">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-file-plus"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M14 3v4a1 1 0 0 0 1 1h4" /><path d="M17 21h-10a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h7l5 5v11a2 2 0 0 1 -2 2z" /><path d="M12 11l0 6" /><path d="M9 14l6 0" /></svg>
      <span>Generar examen</span>
    </button>

    <button class="flex items-center p-2 select-none hover:bg-[#EAEDFB] dark:hover:bg-[#303343] rounded-lg text-black/70 dark:text-[#BEC0C9] gap-2" routerLink="performance" routerLinkActive="!bg-primary !text-white">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-chart-line"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M4 19l16 0" /><path d="M4 15l4 -6l4 2l4 -5l4 4" /></svg>
      <span>Rendimiento</span>
    </button>
  </div>

  <div class="flex flex-col gap-2 py-2 px-2 border-b dark:border-b-[#181a26]">
    <button class="flex items-center p-2 select-none hover:bg-[#EAEDFB] dark:hover:bg-[#303343] rounded-lg text-black/70 dark:text-[#BEC0C9] gap-2">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-logout"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M14 8v-2a2 2 0 0 0 -2 -2h-7a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h7a2 2 0 0 0 2 -2v-2" /><path d="M9 12h12l-3 -3" /><path d="M18 15l3 -3" /></svg>
      <span>Cerrar sesi&oacute;n</span>
    </button>
  </div>
</section>

<section class="flex flex-col items-center justify-center w-full py-2">
  <span class="text-sm text-center text-textPrimaryLight dark:text-textPrimaryDark">© 2025 assistexam.</span>
  <span class="text-sm text-center text-textPrimaryLight dark:text-textPrimaryDark">Todos los derechos reservados.</span>
</section>

</aside>
